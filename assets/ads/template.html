.cta .l{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.cta .a{font-size:calc(7.5px*var(--s));font-weight:600}.cta .b{font-size:calc(15px*var(--s));font-weight:800}
.free{font-size:calc(10px*var(--s));font-weight:700;color:#e0f4ff}

.reef{position:absolute;left:0;right:0;bottom:0;width:100%;height:calc(var(--reef)*1px)}
