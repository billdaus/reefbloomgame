<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reef Bloom — 3D (Experimental)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a3550; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif; }
    #app3d { display: block; width: 100vw; height: 100vh; touch-action: none; }

    #back {
      position: fixed; left: 12px; top: 12px; z-index: 3;
      font-size: 13px; color: #cfe6f4; text-decoration: none;
      background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 8px;
    }
    #slots { position: fixed; left: 12px; top: 46px; z-index: 3; display: flex; gap: 6px; }
    .slot-btn {
      font: inherit; font-size: 12px; color: #cfe6f4; cursor: pointer;
      background: rgba(0,0,0,0.35); border: 1px solid transparent;
      padding: 5px 10px; border-radius: 8px;
    }
    .slot-btn.active { border-color: #7fd8ff; background: rgba(20,80,120,0.7); color: #eaf6ff; }
    /* HUD — a row of frosted-glass chips; BE and Harmony carry mini fill bars,
       and the clock dial's ring is the day ticking by. */
    #hud {
      /* Centered in the strip between the Classic button and the right menu,
         so the chips never slide under either at narrow widths. */
      position: fixed; top: 10px; left: 120px; right: 480px; z-index: 3;
      display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap;
      justify-content: center; pointer-events: none;
    }
    .chip { pointer-events: auto; }
    .chip {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(160deg, rgba(12,44,66,0.82), rgba(4,20,34,0.86));
      border: 1px solid rgba(127,216,255,0.22);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 13px; padding: 6px 12px; color: #eaf6ff;
    }
    .chip .ico { font-size: 17px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
    .chip .col { display: flex; flex-direction: column; gap: 3px; min-width: 54px; }
    .chip .val {
      font-size: 15px; font-weight: 700; letter-spacing: 0.3px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .chip .rate { font-size: 10px; font-weight: 600; color: #7fd8b0; margin-left: 5px; }
    .mini-bar {
      height: 4px; border-radius: 2px; background: rgba(255,255,255,0.13); overflow: hidden;
    }
    .mini-bar span { display: block; height: 100%; width: 0; border-radius: 2px; transition: width 0.3s; }
    #be-bar { background: linear-gradient(90deg, #4fc3f7, #7fd8ff); }
    #hm-bar { background: #46c08a; }
    .chip.shop { cursor: pointer; }
    .chip.shop:hover { border-color: #7fd8ff; background: linear-gradient(160deg, rgba(20,70,100,0.85), rgba(8,32,50,0.88)); }
    .chip.clock { padding: 5px 8px; }
    .dial {
      width: 28px; height: 28px; border-radius: 50%; position: relative; flex: none;
      display: grid; place-items: center;
      background: conic-gradient(#ffd54f 0%, rgba(255,255,255,0.14) 0);
    }
    .dial::after {
      content: ""; position: absolute; inset: 2.5px; border-radius: 50%;
      background: rgba(6,24,38,0.94);
    }
    .dial em { position: relative; z-index: 1; font-style: normal; font-size: 13px; line-height: 1; }

    #shop-overlay {
      position: fixed; inset: 0; z-index: 5; display: none;
      align-items: center; justify-content: center; background: rgba(2,12,20,0.6);
    }
    #shop-overlay .panel, .modal3d .panel {
      background: #0d3550; border: 1px solid #2f6f92; border-radius: 14px;
      padding: 20px 22px; min-width: 232px; color: #eaf6ff;
    }
    .modal3d {
      position: fixed; inset: 0; z-index: 5; display: none;
      align-items: center; justify-content: center; background: rgba(2,12,20,0.6);
    }
    .modal3d .panel {
      max-height: 84vh; display: flex; flex-direction: column;
      min-width: 320px; max-width: 440px; width: 92vw;
    }
    .m-title { font-size: 16px; font-weight: 700; }
    .m-sub { font-size: 11px; color: #9fc4dc; margin-top: 3px; }
    .m-body {
      overflow-y: auto; margin-top: 8px; min-height: 0;
      scrollbar-width: thin; scrollbar-color: #2f6f92 transparent;
    }
    .m-tabs { display: flex; gap: 6px; margin-top: 10px; }
    .m-tab {
      font: inherit; font-size: 12px; color: #cfe6f4; cursor: pointer;
      background: rgba(0,0,0,0.35); border: 1px solid transparent;
      padding: 4px 10px; border-radius: 8px;
    }
    .m-tab.active { border-color: #7fd8ff; background: rgba(20,80,120,0.7); }
    .m-sec {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: #7fb8d4; margin: 10px 0 4px;
    }
    .m-row {
      display: flex; align-items: center; gap: 8px; font-size: 12.5px;
      padding: 5px 2px; border-bottom: 1px solid rgba(47,111,146,0.25);
    }
    .m-row .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
    .m-row small { color: #9fc4dc; margin-left: auto; text-align: right; flex: none; }
    .m-row.locked { opacity: 0.45; }
    .m-bar {
      height: 8px; border-radius: 4px; background: #12293a;
      overflow: hidden; margin: 3px 0 10px;
    }
    .m-bar span { display: block; height: 100%; background: #46c08a; border-radius: 4px; }
    .m-bar span.full { background: #ffd54f; }
    #menu3d { position: fixed; right: 12px; top: 12px; z-index: 3; display: flex; gap: 6px; }
    .menu-btn {
      font: inherit; font-size: 12px; color: #cfe6f4; cursor: pointer;
      background: rgba(0,0,0,0.35); border: 1px solid transparent;
      padding: 5px 10px; border-radius: 8px;
    }
    .menu-btn:hover { border-color: #7fd8ff; color: #eaf6ff; }
    .shop-pack {
      display: flex; justify-content: space-between; gap: 24px; width: 100%;
      background: rgba(20,80,120,0.5); border: 1px solid #2f6f92; color: #eaf6ff;
      border-radius: 8px; padding: 9px 12px; margin: 5px 0; cursor: pointer;
      font: inherit; font-size: 13px;
    }
    .shop-pack:hover { background: rgba(30,110,150,0.75); }
    .shop-close {
      width: 100%; margin-top: 8px; background: none; border: none;
      color: #9fc4dc; cursor: pointer; font: inherit; font-size: 12px; padding: 6px;
    }

    /* Species palette — docked to the right edge so it never covers the reef. */
    #palette {
      position: fixed; right: 12px; top: 84px; bottom: 34px; width: 238px; z-index: 3;
      display: flex; flex-direction: column; gap: 5px; overflow-y: auto;
      padding: 8px 10px; background: rgba(3,18,28,0.55); border-radius: 12px;
      scrollbar-width: thin; scrollbar-color: #2f6f92 transparent;
    }
    #palette.hidden { display: none; }
    #palette::-webkit-scrollbar { width: 8px; }
    #palette::-webkit-scrollbar-thumb { background: #2f6f92; border-radius: 4px; }
    #palette-toggle {
      position: fixed; right: 12px; top: 50px; z-index: 3; width: 238px;
      font: inherit; font-size: 12px; color: #cfe6f4; cursor: pointer; text-align: left;
      background: rgba(3,18,28,0.72); border: 1px solid transparent;
      padding: 6px 12px; border-radius: 10px;
    }
    #palette-toggle:hover { border-color: #7fd8ff; color: #eaf6ff; }
    .coral-btn {
      display: flex; align-items: center; gap: 6px; flex: none;
      font: inherit; font-size: 13px; color: #eaf6ff; cursor: pointer; text-align: left;
      background: rgba(0,0,0,0.4); border: 1px solid transparent;
      padding: 6px 10px; border-radius: 10px;
    }
    .coral-btn small { color: #9fc4dc; margin-left: auto; }
    .coral-btn.sel { border-color: #7fd8ff; background: rgba(20,80,120,0.7); }
    .coral-btn .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .coral-btn .lv {
      font-size: 10px; color: #ffd27f; background: rgba(0,0,0,0.35);
      padding: 1px 5px; border-radius: 8px; letter-spacing: 0.5px;
    }
    .coral-btn.locked { opacity: 0.4; }
    .coral-btn.locked .dot { filter: grayscale(1); }
    .remove-btn { border-color: rgba(239,83,80,0.5); color: #ffb4ac; }
    .remove-btn.on { background: rgba(239,83,80,0.55); border-color: #ef5350; color: #fff; }

    /* 🎁 Packs — reveal cards flip in one after another; FREE marks a voucher. */
    .pack-card {
      display: flex; align-items: center; gap: 12px;
      background: rgba(20,80,120,0.45); border: 1px solid #2f6f92;
      border-radius: 10px; padding: 12px 14px; margin: 8px 0;
      opacity: 0; transform: translateY(10px) scale(0.97);
      animation: packReveal 0.45s ease forwards;
    }
    .pack-card .pc-icon { font-size: 26px; line-height: 1; }
    .pack-card small { color: #9fc4dc; }
    @keyframes packReveal { to { opacity: 1; transform: none; } }
    .pack-open-btn {
      margin-left: auto; flex: none; font: inherit; font-size: 12px; cursor: pointer;
      background: rgba(255,210,127,0.15); border: 1px solid #ffd27f; color: #ffd27f;
      padding: 4px 12px; border-radius: 8px;
    }
    .pack-open-btn:hover { background: rgba(255,210,127,0.3); }
    .free-badge {
      font-size: 10px; color: #ffd27f; background: rgba(0,0,0,0.35);
      padding: 1px 5px; border-radius: 8px; letter-spacing: 0.5px;
    }

    #hint {
      position: fixed; left: 12px; bottom: 64px; z-index: 3;
      font-size: 12px; color: #9fc4dc; background: rgba(0,0,0,0.3);
      padding: 5px 9px; border-radius: 8px; pointer-events: none;
    }
    #version-badge-3d {
      position: fixed; right: 10px; bottom: 8px; z-index: 3;
      font-size: 12px; color: #7fa8c0; letter-spacing: 1px; pointer-events: none;
    }
    #bubbles-speech {
      position: fixed; z-index: 4; display: none; max-width: 240px; width: max-content;
      transform: translate(-50%, -115%);
      background: rgba(5,13,24,0.92); border: 1.5px solid #4080a8; border-radius: 10px;
      padding: 8px 12px; font-size: 12px; line-height: 1.45; color: #ddeeff;
      pointer-events: none;
    }

    /* Touchscreens: fatter buttons and roomier rows so taps land first try. */
    @media (pointer: coarse) {
      .chip { padding: 9px 13px; }
      .coral-btn { padding: 11px 12px; font-size: 14px; }
      #palette { gap: 7px; }
      #palette-toggle { padding: 11px 14px; font-size: 14px; }
      .menu-btn { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <a id="back" href="/">← Classic</a>
  <div id="slots"></div>
  <div id="menu3d"></div>
  <div id="hud">
    <div class="chip" title="Bubble Energy — the bar shows how full your wallet is">
      <span class="ico">🫧</span>
      <div class="col">
        <span class="val"><span id="be-count">0</span><small class="rate" id="be-rate">+0.0/s</small></span>
        <div class="mini-bar"><span id="be-bar"></span></div>
      </div>
    </div>
    <div class="chip" title="Harmony">
      <span class="ico">⚖️</span>
      <div class="col">
        <span class="val" id="hm-count">50</span>
        <div class="mini-bar"><span id="hm-bar"></span></div>
      </div>
    </div>
    <div class="chip" title="Level"><span class="ico">⭐</span><span class="val" id="lvl-count">1</span></div>
    <div class="chip" title="Polyps · click a coral to upgrade it"><span class="ico">🪸</span><span class="val" id="polyp-count">0</span></div>
    <div class="chip shop" id="shop-btn" title="Pearls · tap for the shop"><span class="ico">💎</span><span class="val" id="pearl-count">0</span></div>
    <div class="chip clock" title="Time of day"><div class="dial" id="tod-dial"><em id="tod-icon">☀️</em></div></div>
  </div>
  <canvas id="app3d"></canvas>
  <button id="palette-toggle">🪸 Species ▾</button>
  <div id="palette"></div>
  <div id="hint">🏖️ Beach far west · 🌿 Seagrass · 🪸 Coral Reef centre · 🌌 Twilight east — plant in the matching biome · click a coral to upgrade · tap a ＋ plot to expand a reef with 🪸 · ✕ Remove to sell · drag or arrow keys to move · right-drag or two fingers to orbit.</div>
  <div id="version-badge-3d">3Dev 4.3</div>
  <script type="module">
    import { initReefScene3D } from './src/3d/ReefScene3D.js';
    initReefScene3D(document.getElementById('app3d'));
    const paletteToggle = document.getElementById('palette-toggle');
    paletteToggle.onclick = () => {
      const hidden = document.getElementById('palette').classList.toggle('hidden');
      paletteToggle.textContent = hidden ? '🪸 Species ▸' : '🪸 Species ▾';
    };
  </script>
</body>
</html>
